schema_version: '1.1'
name: trigger-programme-schedule-1
description: Should route to programme-schedule.
tags:
- trigger
- skill:programme-schedule
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Build a schedule of accommodation for a three-form-entry primary school and gross it up to GIA with a stated efficiency.
graders:
- name: fires-programme-schedule
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:programme-schedule)"'
  arm: both
