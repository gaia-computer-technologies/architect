schema_version: '1.1'
name: trigger-programme-schedule-2
description: Should route to programme-schedule.
tags:
- trigger
- skill:programme-schedule
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Does this fit? The client wants 12 apartments, a gym and a roof terrace in a building of about 1,400 m2 GIA.
graders:
- name: fires-programme-schedule
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:programme-schedule)"'
  arm: both
