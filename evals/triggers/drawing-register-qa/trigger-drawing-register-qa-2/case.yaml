schema_version: '1.1'
name: trigger-drawing-register-qa-2
description: Should route to drawing-register-qa.
tags:
- trigger
- skill:drawing-register-qa
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Build a drawing register from this folder of PDF drawings: number, title, revision, status and scale for every sheet.'
graders:
- name: fires-drawing-register-qa
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:drawing-register-qa)"'
  arm: both
