schema_version: '1.1'
name: trigger-contract-admin-letter-2
description: Should route to contract-admin-letter.
tags:
- trigger
- skill:contract-admin-letter
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The contractor has sent a notice of delay. As CA I want to acknowledge it and ask for further particulars before deciding anything. Draft the letter.
graders:
- name: fires-contract-admin-letter
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:contract-admin-letter)"'
  arm: both
