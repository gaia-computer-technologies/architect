schema_version: '1.1'
name: trigger-design-brief-2
description: Should route to design-brief.
tags:
- trigger
- skill:design-brief
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Structure this into a brief we can sign off at Stage 1: the client wants a small gallery with a cafe, opening late next year, sustainability is a priority and they have about 1.8M.'
graders:
- name: fires-design-brief
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:design-brief)"'
  arm: both
