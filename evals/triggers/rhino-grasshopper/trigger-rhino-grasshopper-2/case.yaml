schema_version: '1.1'
name: trigger-rhino-grasshopper-2
description: Should route to rhino-grasshopper.
tags:
- trigger
- skill:rhino-grasshopper
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Can you script Rhino to build a stepped massing from my floor outlines, each floor on its own named layer?
graders:
- name: fires-rhino-grasshopper
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:rhino-grasshopper)"'
  arm: both
