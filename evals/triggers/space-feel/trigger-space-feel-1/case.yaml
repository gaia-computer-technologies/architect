schema_version: '1.1'
name: trigger-space-feel-1
description: Should route to space-feel.
tags:
- trigger
- skill:space-feel
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: How does this space feel? A low, dark entrance passage that opens into a 9 m high reading room lit from a single north rooflight.
graders:
- name: fires-space-feel
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:space-feel)"'
  arm: both
