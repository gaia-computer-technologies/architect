schema_version: '1.1'
name: trigger-carbon-estimate-1
description: Should route to carbon-estimate.
tags:
- trigger
- skill:carbon-estimate
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Can you compare the embodied carbon of a CLT frame against a concrete frame for our four-storey office? I'll send the quantities next.
graders:
- name: fires-carbon-estimate
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:carbon-estimate)"'
  arm: both
