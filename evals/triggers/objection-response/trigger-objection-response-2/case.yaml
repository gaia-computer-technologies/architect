schema_version: '1.1'
name: trigger-objection-response-2
description: Should route to objection-response.
tags:
- trigger
- skill:objection-response
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The case officer has raised concerns about the design's impact on the conservation area. Help me prepare a rebuttal before committee.
graders:
- name: fires-objection-response
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:objection-response)"'
  arm: both
