schema_version: '1.1'
name: trigger-design-diagram-2
description: Should route to design-diagram.
tags:
- trigger
- skill:design-diagram
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Can you draw a stacking diagram of the programme by level for my report? Ground: retail and lobby; levels 1 to 3: offices; level 4: plant.'
graders:
- name: fires-design-diagram
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:design-diagram)"'
  arm: both
