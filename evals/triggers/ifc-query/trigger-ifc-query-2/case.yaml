schema_version: '1.1'
name: trigger-ifc-query-2
description: Should route to ifc-query.
tags:
- trigger
- skill:ifc-query
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Make me a door schedule from the IFC model with fire rating and width for each door.
graders:
- name: fires-ifc-query
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:ifc-query)"'
  arm: both
