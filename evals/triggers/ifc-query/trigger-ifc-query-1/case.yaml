schema_version: '1.1'
name: trigger-ifc-query-1
description: Should route to ifc-query.
tags:
- trigger
- skill:ifc-query
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The structural engineer sent an IFC. How many doors and windows are in it, and which walls have no fire rating set?
graders:
- name: fires-ifc-query
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:ifc-query)"'
  arm: both
