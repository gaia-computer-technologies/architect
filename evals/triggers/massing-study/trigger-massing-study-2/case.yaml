schema_version: '1.1'
name: trigger-massing-study-2
description: Should route to massing-study.
tags:
- trigger
- skill:massing-study
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Test option A against option B for this corner site: A is a single six-storey block, B is two slimmer towers. I want feasibility numbers and a massing model.'
graders:
- name: fires-massing-study
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:massing-study)"'
  arm: both
