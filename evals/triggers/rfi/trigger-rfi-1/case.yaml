schema_version: '1.1'
name: trigger-rfi-1
description: Should route to rfi.
tags:
- trigger
- skill:rfi
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The contractor asks what the lintel bearing length is at window W12; the drawing and the spec disagree. Draft our RFI response and update the log.
graders:
- name: fires-rfi
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:rfi)"'
  arm: both
