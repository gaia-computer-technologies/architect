schema_version: '1.1'
name: trigger-rfi-2
description: Should route to rfi.
tags:
- trigger
- skill:rfi
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Write an RFI to the structural engineer asking them to confirm the steel connection at grid C4.
graders:
- name: fires-rfi
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:rfi)"'
  arm: both
