schema_version: '1.1'
name: trigger-site-context-1
description: Should route to site-context.
tags:
- trigger
- skill:site-context
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Read this site for me: north-facing slope down to a river, mature oak on the east boundary, busy road to the south, views west over fields. What does it want to be?'
graders:
- name: fires-site-context
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-context)"'
  arm: both
