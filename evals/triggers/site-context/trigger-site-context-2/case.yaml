schema_version: '1.1'
name: trigger-site-context-2
description: Should route to site-context.
tags:
- trigger
- skill:site-context
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Write up a site appraisal from my survey notes: corner plot, 1 in 12 fall to the rear, terraced neighbours on two sides, bus stop outside the front.'
graders:
- name: fires-site-context
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-context)"'
  arm: both
