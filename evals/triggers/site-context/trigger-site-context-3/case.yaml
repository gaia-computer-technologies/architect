schema_version: '1.1'
name: trigger-site-context-3
description: Should route to site-context.
tags:
- trigger
- skill:site-context
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: What are the opportunities and constraints of this site? Flat infill plot, 8 m wide, two-storey neighbours on both sides, south-facing rear garden, train line 40 m away.
graders:
- name: fires-site-context
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-context)"'
  arm: both
