schema_version: '1.1'
name: trigger-snag-list-2
description: Should route to snag-list.
tags:
- trigger
- skill:snag-list
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Here's the snag CSV from the re-inspection. Turn it into a printable punch list with a status summary.
graders:
- name: fires-snag-list
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:snag-list)"'
  arm: both
