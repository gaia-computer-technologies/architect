schema_version: '1.1'
name: trigger-site-map-1
description: Should route to site-map.
tags:
- trigger
- skill:site-map
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Make a figure-ground of the 300 m around Rotterdam Centraal station for my urban analysis.
graders:
- name: fires-site-map
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-map)"'
  arm: both
