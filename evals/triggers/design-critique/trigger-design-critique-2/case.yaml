schema_version: '1.1'
name: trigger-design-critique-2
description: Should route to design-critique.
tags:
- trigger
- skill:design-critique
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Be my devil''s advocate: our concept is ''a building that disappears into the landscape'' but it''s a 40 m long glass box on a ridge. What would a tough review panel say?'
graders:
- name: fires-design-critique
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:design-critique)"'
  arm: both
