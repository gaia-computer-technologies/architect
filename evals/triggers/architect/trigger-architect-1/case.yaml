schema_version: '1.1'
name: trigger-architect-1
description: Should route to architect.
tags:
- trigger
- skill:architect
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: I'm an architect and I've just taken on a two-storey rear extension for a family in Leeds. Where do I start, and what can you help me with?
graders:
- name: fires-architect
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:architect)"'
  arm: both
