schema_version: '1.1'
name: trigger-precedent-study-2
description: Should route to precedent-study.
tags:
- trigger
- skill:precedent-study
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: What have other architects done with timber housing above a supermarket? I need case studies for a design review.
graders:
- name: fires-precedent-study
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:precedent-study)"'
  arm: both
