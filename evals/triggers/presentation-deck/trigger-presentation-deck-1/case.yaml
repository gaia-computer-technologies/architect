schema_version: '1.1'
name: trigger-presentation-deck-1
description: Should route to presentation-deck.
tags:
- trigger
- skill:presentation-deck
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Structure my slides for the planning committee presentation on Tuesday. I get 10 minutes.
graders:
- name: fires-presentation-deck
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:presentation-deck)"'
  arm: both
