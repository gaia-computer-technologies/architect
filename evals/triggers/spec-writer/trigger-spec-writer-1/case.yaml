schema_version: '1.1'
name: trigger-spec-writer-1
description: Should route to spec-writer.
tags:
- trigger
- skill:spec-writer
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Write an NBS-style outline specification clause for the facing brick: wire-cut red brick, lime mortar, flush joints.'
graders:
- name: fires-spec-writer
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:spec-writer)"'
  arm: both
