schema_version: '1.1'
name: trigger-sun-study-2
description: Should route to sun-study.
tags:
- trigger
- skill:sun-study
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Make me a sun path diagram for our site at 40.71 N, 74.00 W.
graders:
- name: fires-sun-study
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:sun-study)"'
  arm: both
