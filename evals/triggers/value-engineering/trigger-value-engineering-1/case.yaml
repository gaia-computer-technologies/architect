schema_version: '1.1'
name: trigger-value-engineering-1
description: Should route to value-engineering.
tags:
- trigger
- skill:value-engineering
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'The QS has sent 18 VE proposals to cut 400k from the cost plan. Help me respond: which can we accept without losing the scheme?'
graders:
- name: fires-value-engineering
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:value-engineering)"'
  arm: both
