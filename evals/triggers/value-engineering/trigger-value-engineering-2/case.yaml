schema_version: '1.1'
name: trigger-value-engineering-2
description: Should route to value-engineering.
tags:
- trigger
- skill:value-engineering
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The contractor wants to swap the CLT floors for precast hollowcore to save money. Weigh it up and draft our response.
graders:
- name: fires-value-engineering
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:value-engineering)"'
  arm: both
