schema_version: '1.1'
name: trigger-render-prompt-2
description: Should route to render-prompt.
tags:
- trigger
- skill:render-prompt
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: I want to visualise our timber pavilion with Nano Banana from my massing screenshot. What prompt should I use?
graders:
- name: fires-render-prompt
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:render-prompt)"'
  arm: both
