schema_version: '1.1'
name: trigger-ai-policy-2
description: Should route to ai-policy.
tags:
- trigger
- skill:ai-policy
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: A client asked whether we use AI on their scheme. What should we tell clients, and can you write a short disclosure paragraph for our appointment documents?
graders:
- name: fires-ai-policy
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:ai-policy)"'
  arm: both
