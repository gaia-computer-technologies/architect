schema_version: '1.1'
name: trigger-meeting-minutes-2
description: Should route to meeting-minutes.
tags:
- trigger
- skill:meeting-minutes
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Write up this call as formal minutes and tell me what we actually agreed: ''Client: so we''re going with the brick? Me: if you''re happy. Client: yes, but let''s look at the window sizes again. Me: I''ll send two options by the 10th.'''
graders:
- name: fires-meeting-minutes
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:meeting-minutes)"'
  arm: both
