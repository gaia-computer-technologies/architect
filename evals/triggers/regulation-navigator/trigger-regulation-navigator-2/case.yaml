schema_version: '1.1'
name: trigger-regulation-navigator-2
description: Should route to regulation-navigator.
tags:
- trigger
- skill:regulation-navigator
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: What does the IBC say about the number of exits needed from an assembly space, and which chapter applies?
graders:
- name: fires-regulation-navigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:regulation-navigator)"'
  arm: both
