schema_version: '1.1'
name: trigger-regulation-navigator-1
description: Should route to regulation-navigator.
tags:
- trigger
- skill:regulation-navigator
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Which part of the Building Regulations covers the guarding height on a roof terrace for a house in England?
graders:
- name: fires-regulation-navigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:regulation-navigator)"'
  arm: both
