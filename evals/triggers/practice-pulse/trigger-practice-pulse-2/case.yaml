schema_version: '1.1'
name: trigger-practice-pulse-2
description: Should route to practice-pulse.
tags:
- trigger
- skill:practice-pulse
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: What's our staff utilisation and fee burn this quarter? I want a simple practice dashboard.
graders:
- name: fires-practice-pulse
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:practice-pulse)"'
  arm: both
