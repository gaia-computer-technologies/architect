schema_version: '1.1'
name: trigger-client-pushback-1
description: Should route to client-pushback.
tags:
- trigger
- skill:client-pushback
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
