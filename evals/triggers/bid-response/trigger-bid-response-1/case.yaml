schema_version: '1.1'
name: trigger-bid-response-1
description: Should route to bid-response.
tags:
- trigger
- skill:bid-response
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: We've been invited to tender for a primary school extension framework. Quality is 60% of the score. Help me structure our answers against the evaluation criteria and build a compliance matrix.
graders:
- name: fires-bid-response
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:bid-response)"'
  arm: both
