schema_version: '1.1'
name: trigger-concept-narrative-1
description: Should route to concept-narrative.
tags:
- trigger
- skill:concept-narrative
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Write the design statement for our competition entry: a library organised around one top-lit reading hall, cut into the hillside. The jury is mostly architects.'
graders:
- name: fires-concept-narrative
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:concept-narrative)"'
  arm: both
