schema_version: '1.1'
name: trigger-project-email-2
description: Should route to project-email.
tags:
- trigger
- skill:project-email
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Reply to this from the contractor: ''Can we swap the specified windows for a cheaper equivalent? Same performance.'' I want to say we need datasheets first.'
graders:
- name: fires-project-email
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:project-email)"'
  arm: both
