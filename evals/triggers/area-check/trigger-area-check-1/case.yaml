schema_version: '1.1'
name: trigger-area-check-1
description: Should route to area-check.
tags:
- trigger
- skill:area-check
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Here''s the area schedule pulled from the CAD: Living 31.2, Kitchen 14.8, Bed 1 13.1, Bed 2 9.4, Bath 5.2, Hall 7.9 (all m2), GIA 96 m2. What''s the net-to-gross, and do the rooms hit the brief (Living 30, Kitchen 15, Bed 1 12, Bed 2 10) within 5%?'
graders:
- name: fires-area-check
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:area-check)"'
  arm: both
