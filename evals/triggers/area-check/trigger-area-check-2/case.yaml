schema_version: '1.1'
name: trigger-area-check-2
description: Should route to area-check.
tags:
- trigger
- skill:area-check
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Can you check the areas on my ground floor DXF before tomorrow's client meeting? The rooms are closed polylines on the A-ROOM layer.
graders:
- name: fires-area-check
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:area-check)"'
  arm: both
