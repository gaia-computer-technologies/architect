schema_version: '1.1'
name: trigger-site-visit-report-1
description: Should route to site-visit-report.
tags:
- trigger
- skill:site-visit-report
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Write up my site visit: 21 Nov, overcast, attended with the site manager. Blockwork to first floor complete on plots 3 to 5, DPC visible on plot 6, ponding at the rear of plot 4. Photos 1 to 12.'
graders:
- name: fires-site-visit-report
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-visit-report)"'
  arm: both
