schema_version: '1.1'
name: trigger-site-visit-report-2
description: Should route to site-visit-report.
tags:
- trigger
- skill:site-visit-report
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Turn these notes and photos from today''s inspection into a field report: roof trusses delivered, scaffold adapted on the east elevation, insulation stored uncovered.'
graders:
- name: fires-site-visit-report
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-visit-report)"'
  arm: both
