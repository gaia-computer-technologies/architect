schema_version: '1.1'
name: trigger-markup-review-2
description: Should route to markup-review.
tags:
- trigger
- skill:markup-review
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Go through the consultant's PDF markups on the GA plans and make a numbered comment-response table, grouped by sheet.
graders:
- name: fires-markup-review
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:markup-review)"'
  arm: both
