schema_version: '1.1'
name: trigger-markup-review-1
description: Should route to markup-review.
tags:
- trigger
- skill:markup-review
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The client marked up our planning drawings in Bluebeam. Collate all their comments into a schedule we can respond to.
graders:
- name: fires-markup-review
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:markup-review)"'
  arm: both
