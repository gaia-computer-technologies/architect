schema_version: '1.1'
name: trigger-poe-study-2
description: Should route to poe-study.
tags:
- trigger
- skill:poe-study
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: We got 86 survey responses back from the office building's occupants. Help me analyse them into findings and lessons for the next project.
graders:
- name: fires-poe-study
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:poe-study)"'
  arm: both
