schema_version: '1.1'
name: trigger-poe-study-1
description: Should route to poe-study.
tags:
- trigger
- skill:poe-study
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Our school has been occupied for a year. Design a post-occupancy evaluation for it: occupant survey, interview guide and walk-through protocol.'
graders:
- name: fires-poe-study
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:poe-study)"'
  arm: both
