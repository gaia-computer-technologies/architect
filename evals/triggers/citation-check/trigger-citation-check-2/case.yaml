schema_version: '1.1'
name: trigger-citation-check-2
description: Should route to citation-check.
tags:
- trigger
- skill:citation-check
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Our junior used AI to draft the heritage statement. Please fact-check every reference in it before it goes to the council.
graders:
- name: fires-citation-check
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:citation-check)"'
  arm: both
