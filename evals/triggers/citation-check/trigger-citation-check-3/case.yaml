schema_version: '1.1'
name: trigger-citation-check-3
description: Should route to citation-check.
tags:
- trigger
- skill:citation-check
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The daylight consultant's report says 'Smith and Okafor (2021) proved north light improves productivity by 18%'. Is that a real paper and does it say that?
graders:
- name: fires-citation-check
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:citation-check)"'
  arm: both
