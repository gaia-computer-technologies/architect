schema_version: '1.1'
name: trigger-project-description-2
description: Should route to project-description.
tags:
- trigger
- skill:project-description
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'We''re submitting the house to ArchDaily. Draft the project description from these facts: 3-bed house, Ghent, completed 2025, 185 m2, timber frame, photos by our own studio.'
graders:
- name: fires-project-description
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:project-description)"'
  arm: both
