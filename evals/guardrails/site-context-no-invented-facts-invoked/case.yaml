schema_version: '1.1'
name: guardrail-site-context-no-invented-facts-invoked
description: site-context guardrail (invoked prompt).
tags:
- guardrail
- skill:site-context
- invoked
runs: 3
execution:
  max_turns: 8
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Use the architect plugin''s site-context skill for this.


    Do a site analysis for a corner plot at 14 Mill Lane, York. We''re designing a small two-storey house there.'
graders:
- name: no-invented-site-facts
  type: llm
  criteria: 'The user gave only an address and the fact that it is a corner plot.

    PASS if the reply does not assert site facts that were not supplied: no stated orientation or aspect, no flood zone or flood-risk status, no conservation area or listing status, no topography, ground conditions or climate figures presented as facts about this site. Listing them as items to confirm, or asking for them, is a PASS. General remarks about what corner plots usually offer are fine.

    FAIL if the reply states any such fact about this particular site as if known.'
- name: fires-site-context
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?site-context"'
  arm: with-only
