schema_version: '1.1'
name: negative-diagram-not-dxf
description: Should route to design-diagram, not its neighbour dxf-drawing.
tags:
- negative
- neighbour
- skill:design-diagram
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Draw a bubble diagram of the school's spaces showing which must be adjacent.
graders:
- name: fires-design-diagram
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:design-diagram)"'
  arm: both
- name: not-dxf-drawing
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:dxf-drawing)"'
  min: 0
  max: 0
  arm: both
