schema_version: '1.1'
name: negative-ifc-not-revit
description: Should route to ifc-query, not its neighbour revit-mcp.
tags:
- negative
- neighbour
- skill:ifc-query
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: I have an IFC export from the engineer. How many doors lack a fire rating?
graders:
- name: fires-ifc-query
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:ifc-query)"'
  arm: both
- name: not-revit-mcp
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:revit-mcp)"'
  min: 0
  max: 0
  arm: both
