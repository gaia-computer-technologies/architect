schema_version: '1.1'
name: negative-site-report-not-snag
description: Should route to site-visit-report, not its neighbour snag-list.
tags:
- negative
- neighbour
- skill:site-visit-report
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Write up today''s site visit: frame up to level 2, scaffold on the north side, wet weather, concrete pour moved to Thursday.'
graders:
- name: fires-site-visit-report
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-visit-report)"'
  arm: both
- name: not-snag-list
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:snag-list)"'
  min: 0
  max: 0
  arm: both
