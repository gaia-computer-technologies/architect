schema_version: '1.1'
name: negative-email-not-pushback
description: Should route to project-email, not its neighbour client-pushback.
tags:
- negative
- neighbour
- skill:project-email
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Reply to the engineer chasing them for the slab drawings by Friday.
graders:
- name: fires-project-email
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:project-email)"'
  arm: both
- name: not-client-pushback
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:client-pushback)"'
  min: 0
  max: 0
  arm: both
