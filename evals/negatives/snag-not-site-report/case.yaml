schema_version: '1.1'
name: negative-snag-not-site-report
description: Should route to snag-list, not its neighbour site-visit-report.
tags:
- negative
- neighbour
- skill:snag-list
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: 'Turn my walk-round notes into a punch list by room and trade for the contractor: loose socket in bed 2, scratched glazing in the lounge, missing door stop in the hall.'
graders:
- name: fires-snag-list
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:snag-list)"'
  arm: both
- name: not-site-visit-report
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:site-visit-report)"'
  min: 0
  max: 0
  arm: both
