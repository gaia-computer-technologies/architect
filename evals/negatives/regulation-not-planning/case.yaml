schema_version: '1.1'
name: negative-regulation-not-planning
description: Should route to regulation-navigator, not its neighbour planning-research.
tags:
- negative
- neighbour
- skill:regulation-navigator
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Which Approved Document covers the guarding on a roof terrace, and what triggers it?
graders:
- name: fires-regulation-navigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:regulation-navigator)"'
  arm: both
- name: not-planning-research
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:planning-research)"'
  min: 0
  max: 0
  arm: both
