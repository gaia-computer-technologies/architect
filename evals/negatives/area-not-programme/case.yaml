schema_version: '1.1'
name: negative-area-not-programme
description: Should route to area-check, not its neighbour programme-schedule.
tags:
- negative
- neighbour
- skill:area-check
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Measure the rooms in my DXF plan and give me the net-to-gross.
graders:
- name: fires-area-check
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:area-check)"'
  arm: both
- name: not-programme-schedule
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:programme-schedule)"'
  min: 0
  max: 0
  arm: both
