schema_version: '1.1'
name: negative-rfi-not-contract-letter
description: Should route to rfi, not its neighbour contract-admin-letter.
tags:
- negative
- neighbour
- skill:rfi
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: The contractor asks what the lintel bearing is at window W12. Draft the RFI response.
graders:
- name: fires-rfi
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:rfi)"'
  arm: both
- name: not-contract-admin-letter
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:contract-admin-letter)"'
  min: 0
  max: 0
  arm: both
