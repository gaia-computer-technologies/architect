schema_version: '1.1'
name: negative-planning-not-regulation
description: Should route to planning-research, not its neighbour regulation-navigator.
tags:
- negative
- neighbour
- skill:planning-research
runs: 1
execution:
  max_turns: 6
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: Is 12 Elm Row in a conservation area, and what's the planning history of the site?
graders:
- name: fires-planning-research
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:planning-research)"'
  arm: both
- name: not-regulation-navigator
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:architect:)?(?:regulation-navigator)"'
  min: 0
  max: 0
  arm: both
