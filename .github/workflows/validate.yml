name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkers
        run: pip install pyyaml
      - name: Structural lint (manifests, strict skill frontmatter, router, counts)
        run: bash scripts/lint.sh
      - name: Shellcheck hook + lint scripts
        run: shellcheck --severity=error scripts/lint.sh hooks/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Every skill is discoverable by npx skills
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          out="$(npx -y skills@1.9.0 add . --list 2>&1)"
          echo "$out"
          if echo "$out" | grep -qi "skipp"; then echo "npx skills skipped a skill"; exit 1; fi

  evals:
    # The key-free part of the eval suite: every bundled script on its fixtures,
    # the suite's own structure, and the plugin validator. The LLM cases (routing
    # and guardrails) need a paid API key, so they run locally: see evals/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Script evals (fixtures, expected numbers, refusals) and suite checks
        run: uv run --with pytest --with pyyaml pytest evals/scripts -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin validator (no API key needed)
        env:
          DISABLE_TELEMETRY: "1"
        run: npx -y @anthropic-ai/claude-code@2.1.319 plugin validate .
